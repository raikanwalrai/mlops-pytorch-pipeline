# Dataset Configuration
dataset:
  data_dir: "./data"
  batch_size: 256 #64
  num_workers: 2
  subset_size: 10 #1000

# Model Configuration
model:
  num_classes: 10
  pretrained: true

# Training Configuration
training:
  epochs: 1 #10
  learning_rate: 0.001 

# Checkpoint Configuration
checkpoint:
  save_dir: "./checkpoints"
  filename: "best_model.pth"

# Early Stopping Configuration
early_stopping:
  patience: 3


 