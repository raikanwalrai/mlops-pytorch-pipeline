apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: pytorch-serving
  namespace: mlops-pipeline

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pytorch-serving

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70